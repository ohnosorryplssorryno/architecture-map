# Prüft bei jedem Push und Pull Request die Daten (ohne Netzzugriff auf Wikidata).
# Das Ergebnis steht im Reiter „Actions“; die Seite wird unabhängig davon veröffentlicht.
name: Datenprüfung

on:
  push:
    paths: ['data/**', 'tools/check-data.mjs', '.github/workflows/check-data.yml']
  pull_request:
    paths: ['data/**', 'tools/check-data.mjs']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-data.mjs
